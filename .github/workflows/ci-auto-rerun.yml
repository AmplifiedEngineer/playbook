#
# Reruns the failed jobs of a CI run once when the failure came from the
# infrastructure (checkout could not reach github.com, a setup step broke, a
# job hit its timeout) and not from the code. GitHub Actions has no native job
# retry. scripts/ci-should-rerun.sh holds the rules.
#
# The workflow looks for runs on a schedule and does not use the `workflow_run`
# trigger. That trigger runs with a write token for fork pull requests too, and
# zizmor rates it as dangerous. A sweep reads the run list through the API,
# skips runs from forks, and never checks out or runs pull request code: the
# checkout has no `ref`, so it gets the default branch and only supplies the
# decision script.

name: ci-auto-rerun

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

# One sweep at a time. A sweep that overlaps another waits, so one run is not
# rerun twice.
concurrency:
  group: ci-auto-rerun
  cancel-in-progress: false

jobs:
  rerun:
    name: rerun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # gh run rerun needs write access to Actions
      contents: read # the checkout supplies the decision script
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Keep in step with the `name:` of each workflow. Not listed on purpose:
      # this workflow, release (a publish must not repeat on its own),
      # auto-update-pr, dependabot-auto-merge, lock, stale and scorecard.
      WATCHED: >-
        betterleaks,breaking-changes,CLA & DCO,PR Quality Gate,commit-message-guard,
        Commit Lint,Dependency Review,docs-links,intents-contract,license,osv-scan,
        plugin-guards,rust-ci,shell-ci,zizmor
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rerun failed jobs after an infrastructure failure
        shell: bash
        run: |
          set -euo pipefail

          # Only the first attempt is eligible, so a run is rerun at most once.
          # Runs from forks are skipped, see the header. A run that finished
          # more than three hours ago is left alone.
          since="$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          watched="$(printf '%s' "$WATCHED" | tr -d '\n' | sed 's/, */,/g')"
          ids="$(
            gh api --paginate "repos/$GH_REPO/actions/runs?status=completed&created=>=$since&per_page=100" \
              --jq ".workflow_runs[]
                | select(.conclusion == \"failure\" or .conclusion == \"timed_out\")
                | select(.run_attempt == 1)
                | select(.head_repository.full_name == \"$GH_REPO\")
                | select(.name as \$n | \"$watched\" | split(\",\") | index(\$n))
                | .id"
          )"

          if [ -z "$ids" ]; then
            echo "No first-attempt failures to look at." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for id in $ids; do
            case "$id" in
              ''|*[!0-9]*) echo "run id is not numeric" >&2; exit 1 ;;
            esac
            url="https://github.com/$GH_REPO/actions/runs/$id"
            jobs_file="$RUNNER_TEMP/jobs-$id.json"
            gh run view "$id" --json jobs > "$jobs_file"

            decision=0
            report="$(bash scripts/ci-should-rerun.sh --json-file "$jobs_file")" || decision=$?
            {
              echo "### $url"
              echo
              echo '```'
              echo "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$decision" -eq 0 ]; then
              gh run rerun "$id" --failed
              echo "Reran the failed jobs of run $id once." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$decision" -eq 1 ]; then
              echo "No rerun: the failure looks like code, or no failed job was found." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The decision script failed (exit $decision)." >&2
              exit "$decision"
            fi
          done
