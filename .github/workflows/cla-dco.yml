name: CLA & DCO

# Calls the shared checks in cla-dco-checks.yml of amplifiedengineer/.github,
# pinned by commit like any other action. Bump the commit and tooling-ref
# together when the shared workflow changes. A contributor signs the CLA by adding
# a row to .github/CONTRIBUTORS.md in a commit of their own, so this workflow
# needs no comment trigger, no write permission and no secret. The job id must
# stay `cla-dco` so the required checks read `cla-dco / dco` and
# `cla-dco / cla-check`.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cla-dco:
    name: cla-dco
    permissions:
      contents: read # the called jobs fetch the pull request commits
      pull-requests: read # the called jobs list the commits with their logins
    uses: amplifiedengineer/.github/.github/workflows/cla-dco-checks.yml@c05ff4d8c6afd0f6a4506fdbddc35aacb8667160 # v0.1.0
    with:
      tooling-ref: c05ff4d8c6afd0f6a4506fdbddc35aacb8667160 # same commit as v0.1.0
