name: CLA & DCO

# Calls the shared checks in dco-cla.yml and the signing job in cla-sign.yml.
# Other repos copy this file and call
# `pragmatic-engineer/.github/.github/workflows/<name>.yml@<commit>` instead of
# the local paths. Pin the commit like any other action and bump it when the
# shared workflows change. The job id must stay `cla-dco` so the required checks
# read `cla-dco / dco` and `cla-dco / cla-check` in every repo.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.comment.id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cla-dco:
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      pull-requests: read
    uses: pragmatic-engineer/.github/.github/workflows/dco-cla.yml@2ca0eee10318bdfc1fbc44cc26fad9875c0ed79b # main

  cla-sign:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: write
      pull-requests: write
    uses: pragmatic-engineer/.github/.github/workflows/cla-sign.yml@2ca0eee10318bdfc1fbc44cc26fad9875c0ed79b # main
