#
# CI gate for the repo's own shell code. What is left is the installer
# (install.sh, run through curl | bash), which must work before any binary
# exists. Its behavior is tested in Rust (tests/install_*.rs). Runs on ubuntu-latest and
# macos-latest so the BSD code paths execute too. Validates:
#   - ShellCheck static analysis on every shell script (Linux only, lint once)
#   - Bash syntax (bash -n) on every shell script
#   - No personal identifier or maintainer-specific string in tracked files
#   - Any remaining `*.test.sh` suite, discovered via `git ls-files`

name: shell-ci

on:
  pull_request:
    # ready_for_review starts the macOS lane that draft pull requests skip.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: shell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the change so docs-only PRs skip the heavy lanes. Required
  # checks must still report, so the gated jobs below keep running and skip at
  # STEP level (a skipped matrix job would leave "lint-and-test (<os>)" pending and
  # block the merge queue). Fails open: any error means docs_only=false.
  #
  # Docs-only means every changed path is a root policy file (README.md,
  # CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, CHANGELOG.md) or a *.md
  # under docs/. seed/, hooks/ and .github/ are never docs-only: tests
  # read them.
  changes:
    runs-on: ubuntu-latest
    # timeout-minutes: max(5, 3x slowest success seen); a hung job fails fast.
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The docs-only pattern below is also kept in rust-ci.yml and in the
          # paths-ignore list of osv-scan.yml. Change all three together.
          docs_only=false
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && [ "${base#0000000}" = "$base" ] \
              && git fetch --no-tags --depth=1 origin "$base" 2>/dev/null \
              && files="$(git diff --name-only "$base" HEAD)" \
              && [ -n "$files" ]; then
            echo "$files"
            if ! echo "$files" | grep -qvE '^(docs/.+\.md|(README|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT|CHANGELOG)\.md)$'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: changes
    # Run even if `changes` failed (fail open); never let a skipped needs
    # turn a required check into a skipped one.
    if: ${{ !cancelled() }}
    # A draft pull request runs the macOS leg on a Linux runner with every
    # step skipped, so the required check still reports and no macOS slot is
    # used. ready_for_review runs the full leg.
    runs-on: ${{ (matrix.os == 'macos-latest' && github.event_name == 'pull_request' && github.event.pull_request.draft) && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DRAFT_SKIP: ${{ matrix.os == 'macos-latest' && github.event_name == 'pull_request' && github.event.pull_request.draft }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        # Linux-only action; it self-skips on macOS with a confusing warning.
        if: runner.os == 'Linux' && env.DRAFT_SKIP != 'true'
        with:
          # Kept on audit (not block) — apt-get pulls from Ubuntu archive
          # mirrors that rotate per runner placement (azure.archive.ubuntu.com,
          # security.ubuntu.com, esm.ubuntu.com, etc.). harden-runner has no
          # wildcard support so a strict block-mode allowlist would break when
          # the runner lands on a different mirror than the one sampled.
          # Audit mode still enforces the global blocklist of known-compromised
          # C2/exfil endpoints. Reassess if step-security adds wildcard support.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        if: runner.os == 'Linux' && env.DRAFT_SKIP != 'true' && needs.changes.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck (.sh files)
        # Lint once, on Linux only: shellcheck is not preinstalled on macOS
        # runners and static analysis is platform-independent.
        # Stays at warning rather than style: of the 87 findings below warning
        # (measured 2026-08-18), most are deliberate idiom, and 7 are SC1091
        # which survives even `shellcheck -x`. Tightening would mean adding
        # disable directives, not fixing bugs.
        if: runner.os == 'Linux' && env.DRAFT_SKIP != 'true' && needs.changes.outputs.docs_only != 'true'
        run: git ls-files '*.sh' | xargs shellcheck --severity=warning

      - name: Bash syntax check
        if: env.DRAFT_SKIP != 'true' && needs.changes.outputs.docs_only != 'true'
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      # Always runs, docs-only or not: it greps docs/ and README.md too.
      - name: Personal-identifier grep
        if: env.DRAFT_SKIP != 'true'
        run: scripts/check-identifiers.sh

      - name: Run behavioral test suites
        if: env.DRAFT_SKIP != 'true' && needs.changes.outputs.docs_only != 'true'
        # Discover every suite so a new *.test.sh is picked up automatically.
        # The git identity is needed by the worktree suites, which commit.
        #
        # Written to a THROWAWAY global config, never to a repo and never as
        # GIT_AUTHOR_*/GIT_COMMITTER_*.
        #
        # An unscoped `git config user.email` writes into the checked-out
        # repo's .git/config, harmless on an ephemeral runner but permanent
        # when the step is reproduced locally: on 2026-08-20 it rewrote a real
        # repo's identity and the next commit was authored by a user GitHub
        # cannot resolve, so its signature would not verify. `git config
        # --local` does not help, since that is already what an unscoped write
        # does.
        #
        # Environment variables are NOT the fix either. They sit ABOVE per-repo
        # config in git's precedence, so they override every fixture that sets
        # its own identity; that once broke a worktree suite.
        # GIT_CONFIG_GLOBAL keeps the identity at global precedence, which a
        # fixture's own `git config user.email` still beats, exactly as before.
        run: |
          GIT_CONFIG_GLOBAL="$(mktemp)"
          export GIT_CONFIG_GLOBAL
          git config --global user.email "ci@github.local"
          git config --global user.name "CI"
          for f in $(git ls-files '*.test.sh'); do
            echo "== $f"
            bash "$f" || exit 1
          done
