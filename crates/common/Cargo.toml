[package]
name = "playbook-common"
version = "0.1.0"
edition.workspace = true
description = "Shared helpers for the playbook crates: paths, git, sqlite, atomic files"
license.workspace = true
publish = false

[lib]
name = "playbook_common"
path = "src/lib.rs"

[dependencies]
playbook-store = { path = "../store" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["process"] }

[lints]
workspace = true
