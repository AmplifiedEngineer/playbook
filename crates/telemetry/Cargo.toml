[package]
name = "playbook-telemetry"
version.workspace = true
edition.workspace = true
description = "Agent Budget Dashboard for Claude Code sessions: a terminal view, reports and an optional telemetry receiver"
license.workspace = true
repository = "https://github.com/amplifiedengineer/playbook"
publish = false

[lib]
name = "playbook_telemetry"
path = "src/lib.rs"

[[bin]]
name = "pbtop"
path = "src/bin/pbtop.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
playbook-common = { path = "../common" }
playbook-data = { path = "../data" }
playbook-store = { path = "../store" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["process", "system"] }

[dev-dependencies]
playbook-common = { path = "../common" }

[lints]
workspace = true
