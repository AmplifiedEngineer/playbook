# Pinned inputs for the code index benchmark. Every repo is pinned by commit,
# cloned on demand and never redistributed. Only allowlisted licenses enter.
# ripgrep is dual licensed (Unlicense or MIT); the MIT arm is recorded.

[tools]
rg = "15.2.0"
ctags = "6.2.0"
tokenizer = "playbook-lexical-v1"

[tools.oracles]
rust-analyzer = "2025-07-14"
scip-go = "0.1.26"
scip-python = "0.6.6"
scip-typescript = "0.4.0"

[[repos]]
name = "ripgrep"
url = "https://github.com/BurntSushi/ripgrep.git"
commit = "4649aa9700619f94cf9c66876e9549d83420e16c"
language = "rust"
tier = "pilot"
size_kb = 3500
license = "MIT"

