[package]
name = "code-bench"
version.workspace = true
edition.workspace = true
description = "Dev-only benchmark for the code index: corpus, metrics and gate"
license.workspace = true
publish = false

[lib]
name = "code_bench"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
playbook-common = { path = "../common" }

[lints]
workspace = true
