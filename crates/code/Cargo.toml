[package]
name = "playbook-code"
version.workspace = true
edition.workspace = true
description = "Local source index for playbook: symbols, search, references and context"
license.workspace = true
publish = false

[lib]
name = "playbook_code"
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.10"
playbook-common = { path = "../common" }
playbook-data = { path = "../data" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tar = { version = "=0.4.46", default-features = false }
tree-sitter = "=0.27.1"
tree-sitter-go = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["process"] }
signal-hook = { version = "=0.3.18", default-features = false }

[lints]
workspace = true
