[package]
name = "playbook-store"
version = "0.1.0"
edition.workspace = true
description = "The one place playbook reaches SQLite: a thin shim over the storage engine"
license.workspace = true
publish = false

[lib]
name = "playbook_store"
path = "src/lib.rs"

[features]
default = ["engine-rusqlite"]
engine-rusqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"], optional = true }

[lints]
workspace = true
